<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Friend Duel — BrainBox</title>
<meta name="theme-color" content="#b91c1c">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<style>

  .fd-tabs{display:flex;gap:8px;padding:0 14px 10px}
  .fd-tab{flex:1;border:none;border-radius:12px;padding:9px;font-family:"Baloo 2",sans-serif;font-weight:800;background:rgba(0,0,0,.07);color:inherit;cursor:pointer}
  .fd-tab.on{background:var(--kit-accent);color:#fff}
  .fd-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #f0e8f7}
  .fd-row:first-child{border-top:0}
  .fd-tag{font-size:.72rem;font-weight:800;border-radius:100px;padding:2px 10px;background:#eee4f7;color:#6b3f9b}
  .fd-tag.win{background:#c9f2d3;color:#15803d}.fd-tag.lose{background:#ffd9d9;color:#b91c1c}
  .fd-search{width:100%;padding:10px;border:2px solid #e6dcf5;border-radius:12px;font:inherit;margin-bottom:8px}

</style>
</head>
<body>
<div class="kit-page" id="app">
  <div class="kit-top"><a href="../game-room/" class="kit-back">←</a><div class="kit-title">⚔️ Friend Duel</div></div>

  <div class="fd-tabs"><button class="fd-tab on" data-t="inbox">📬 Duels</button><button class="fd-tab" data-t="new">➕ New duel</button></div>
  <div id="fd-main"></div><div id="fd-overlay"></div>

</div>
<script src="../player.js"></script>
<script src="../firebase.js"></script>
<script src="../leaderboard.js"></script>
<script src="../skin.js"></script>
<script src="../juice.js"></script>
<script src="../mathville/generators.js"></script>
<script src="../question-pools.js?v=2"></script>
<script src="../gamekit.js"></script>
<script>AIGKit.mount({title:'Friend Duel',accent:'#b91c1c',bg:'linear-gradient(180deg,#fdeeee,#f6d9dc)'});</script>
<script src="script.js"></script>
</body>
</html>
