<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Garage — BrainBox</title>
<meta name="theme-color" content="#b45309">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<style>

  .gg-funrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
  .gg-cbar{display:inline-block;width:90px;height:8px;background:#ddd;border:2px solid #1b1b1b;vertical-align:middle}.gg-cbar i{display:block;height:100%;background:#5fb83a}
  .gg-road{position:relative;height:260px;background:repeating-linear-gradient(90deg,#555 0 32%,#ddd 32% 33.3%);border:3px solid #1b1b1b;overflow:hidden;margin-bottom:10px}
  .gg-road.hit{animation:ggHit .3s}@keyframes ggHit{50%{background-color:#c33;transform:translateX(4px)}}
  .gg-me{position:absolute;bottom:6%;width:56px;transform:translateX(-50%);transition:left .12s}.gg-me svg{width:56px;height:auto}
  .gg-cone{position:absolute;transform:translateX(-50%);font-size:1.6rem}
  .gg-strip{position:relative;height:34px;background:#eee;border:2px solid #1b1b1b;margin-bottom:6px}.gg-strip span{position:absolute;left:0;top:2px;font-size:1.4rem;transition:left .3s;transform:scaleX(-1)}
  .gg-tabs{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
  .gg-tab{flex:none;border:none;border-radius:100px;padding:8px 14px;font-family:"Baloo 2",sans-serif;font-weight:800;background:rgba(0,0,0,.07);color:inherit;cursor:pointer}
  .gg-tab.on{background:var(--kit-accent);color:#fff}
  .gg-car{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #f4e6d2}
  .gg-car:first-child{border-top:0}
  .gg-th{flex:none;width:56px;height:70px;display:grid;place-items:center;background:#fff8ee;border-radius:12px;position:relative}
  .gg-th .sticker{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:14px}
  .gg-th svg{transform:scale(1.4)}
  .gg-body{flex:1;min-width:0}
  .gg-name{font-family:"Baloo 2",sans-serif;font-weight:800}
  .gg-lv{display:flex;gap:3px;margin:3px 0}
  .gg-lv i{width:16px;height:7px;border-radius:4px;background:#e5d5be}.gg-lv i.on{background:#f59e0b}
  .gg-sub{font-size:.72rem;color:#8a7a6a;font-weight:700}
  .gg-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .gg-btns .kit-btn{padding:6px 12px;font-size:.78rem}
  .gg-paint{background:#fff8ee;border-radius:14px;padding:12px;margin:8px 0}
  .gg-sw{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .gg-sw button{border:2px solid #e5d5be;background:#fff;border-radius:10px;padding:4px 10px;font-weight:800;cursor:pointer;color:inherit}
  .gg-sw button.on{border-color:#b45309;background:#fde68a}

  .gg-track{position:relative;height:46px;background:repeating-linear-gradient(90deg,#555 0 18px,#666 18px 36px);border:3px solid #1b1b1b;margin:8px 0}.gg-track #gg-car{position:absolute;top:6px;font-size:1.7rem;transition:left .35s;transform:scaleX(-1)}.gg-track #gg-car.spin{animation:ggSpin .6s}@keyframes ggSpin{to{transform:scaleX(-1) rotate(360deg)}}
</style>
<link rel="stylesheet" href="/blockworld-games.css?v=6" />
<script>document.documentElement.classList.add("bw-g");document.documentElement.dataset.bw="garage";</script>
</head>
<body>
<div class="kit-page" id="app">
  <div class="kit-top"><a href="../" class="kit-back">←</a><div class="kit-title">🔧 Vehicle Workshop</div></div>

  <div class="kit-hud"><span id="gg-wallet"></span></div>
  <div class="kit-card" id="gg-fun"></div>
  <div class="gg-tabs" id="gg-tabs"></div>
  <div class="kit-card" id="gg-main"></div>
  <div id="gg-overlay"></div>

</div>
<script src="../player.js"></script>
<script src="../firebase.js"></script>
<script src="../leaderboard.js?v=4"></script>
<script src="../skin.js"></script>
<script src="../juice.js"></script>
<script src="../mathville/generators.js?v=5"></script>
<script src="../question-pools.js?v=3"></script>
<script src="../vehicles.js"></script>
<script src="../gamekit.js?v=5"></script>
<script>AIGKit.mount({title:'Vehicle Workshop',accent:'#b45309',bg:'linear-gradient(180deg,#fff3e0,#ffdcae)'});</script>
<script src="script.js?v=3"></script>
</body>
</html>
