<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Bo's Classroom — BrainBox</title>
<meta name="theme-color" content="#0e7490">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<style>

  .bc-board{background:#1f3b34;border:8px solid #b7834a;border-radius:14px;color:#fff;padding:16px 12px;min-height:170px;text-align:center}
  .bc-board .txt{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.05rem;line-height:1.5;margin-top:10px}
  .bc-vis{font-size:2rem;line-height:1.35;min-height:60px}
  .bc-vis span{display:inline-block;animation:bcPop .45s both}
  .bc-vis .sep{margin:0 8px;opacity:.7}
  @keyframes bcPop{0%{transform:scale(0) rotate(-40deg);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
  .bc-lessons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bc-l{border:2px solid rgba(0,0,0,.08);background:#faf6ff;border-radius:14px;padding:12px 6px;text-align:center;font-family:"Baloo 2",sans-serif;font-weight:800;cursor:pointer;color:inherit}
  .bc-l .e{font-size:2rem;display:block}.bc-l.done{background:#e5f5e8;border-color:#34c759}
  .bc-dots{display:flex;gap:6px;justify-content:center;margin:8px 0}.bc-dots i{width:9px;height:9px;border-radius:50%;background:#cfd8dc}.bc-dots i.on{background:#0e7490}

</style>
</head>
<body>
<div class="kit-page" id="app">
  <div class="kit-top"><a href="../game-room/" class="kit-back">←</a><div class="kit-title">🎓 Bo's Classroom</div></div>

  <div id="bc-main"></div><div id="bc-overlay"></div>

</div>
<script src="../player.js"></script>
<script src="../firebase.js"></script>
<script src="../leaderboard.js"></script>
<script src="../skin.js"></script>
<script src="../juice.js"></script>
<script src="../mathville/generators.js"></script>
<script src="../question-pools.js?v=2"></script>
<script src="../gamekit.js"></script>
<script>AIGKit.mount({title:"Bo's Classroom",accent:'#0e7490',bg:'linear-gradient(180deg,#e0f7fa,#bde9ef)'});</script>
<script src="script.js"></script>
</body>
</html>
