<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Science Lab — BrainBox</title>
<meta name="theme-color" content="#0e7490">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<style>

  .sl-bench{background:linear-gradient(180deg,#f1f5f9,#e2e8f0);border-radius:16px;text-align:center;padding:14px 8px;margin-bottom:10px}
  .sl-scene{font-size:3rem;line-height:1.2;min-height:64px;letter-spacing:6px}
  .sl-scene.anim{animation:slPop .5s}
  @keyframes slPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  .sl-fact{background:#ecfeff;border:2px solid #67e8f9;border-radius:12px;padding:10px;font-weight:700;font-size:.85rem;line-height:1.45;margin-top:10px;text-align:left}

  .sl-steps{display:flex;gap:4px;justify-content:center;margin-bottom:6px}.sl-steps span{font-size:.68rem;font-weight:800;padding:2px 6px;border:2px solid #1b1b1b;opacity:.4}.sl-steps span.on{opacity:1;background:#c9f2d3}
  .sl-badges{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:10px}.sl-badges span{font-size:.7rem;font-weight:800;border:2px dashed #aaa;padding:2px 6px;opacity:.6}.sl-badges span.on{border:2px solid #b8860b;background:#fff3c4;opacity:1}
  .sl-note{border-top:1px solid #ddd;padding:6px 0;font-size:.85rem}.sl-note.off{opacity:.5}
  .sl-var{border:2px solid #1b1b1b;padding:8px;margin-bottom:8px;display:grid;gap:6px;background:#fff}.sl-var input{width:100%}
  .sl-shadow{height:90px;position:relative;background:#fffbe6;display:flex;align-items:center}.sl-shd{display:block;width:40px;height:50px;background:#333;margin-left:auto;margin-right:30px;transition:transform .2s}
  .sl-chart{display:flex;gap:10px;align-items:flex-end;height:140px;margin:10px 0;padding:6px;border-bottom:3px solid #1b1b1b}.sl-chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.7rem}.sl-chart i{display:block;width:70%;background:#4fb3e0;border:2px solid #1b1b1b;min-height:4px}.sl-chart small{opacity:.7}
</style>
<link rel="stylesheet" href="/blockworld-games.css?v=6" />
<script>document.documentElement.classList.add("bw-g");document.documentElement.dataset.bw="science-lab";</script>
</head>
<body>
<div class="kit-page" id="app">
  <div class="kit-top"><a href="../game-room/" class="kit-back">←</a><div class="kit-title">🧪 Science Lab</div></div>

  <div class="kit-hud"><span>🧪 Experiment <b id="sl-n">1</b>/6</span><span>🔬 Right: <b id="sl-r">0</b></span></div>
  <div class="kit-card" id="sl-card"></div>
  <div id="sl-overlay"></div>

</div>
<script src="../player.js"></script>
<script src="../firebase.js"></script>
<script src="../leaderboard.js?v=4"></script>
<script src="../skin.js"></script>
<script src="../juice.js"></script>
<script src="../mathville/generators.js?v=5"></script>
<script src="../question-pools.js?v=3"></script>
<script src="../gamekit.js?v=5"></script>
<script>AIGKit.mount({title:'Science Lab',accent:'#0e7490',bg:'linear-gradient(180deg,#e0f7fa,#bfe9ef)'});</script>
<script src="script.js?v=4"></script>
</body>
</html>
