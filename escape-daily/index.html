<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Escape Room Daily — BrainBox</title>
<meta name="theme-color" content="#0e7490">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<style>

  .ed-room{text-align:center}
  .ed-scene{font-size:2.6rem;margin:4px 0}
  .ed-title{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.05rem}
  .ed-digits{display:flex;justify-content:center;gap:8px;margin:6px 0 12px}
  .ed-digit{width:38px;height:46px;border-radius:10px;background:#1e293b;color:#fbbf24;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.6rem;display:grid;place-items:center}
  .ed-digit.empty{color:#475569}
  .ed-input{width:100%;padding:12px;border:2px solid #cbd5e1;border-radius:12px;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.2rem;text-align:center;margin-bottom:8px}
  .ed-tiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
  .ed-tile{width:42px;height:46px;border-radius:10px;border:2px solid #cbd5e1;background:#f8fafc;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.3rem;cursor:pointer;color:inherit}
  .ed-tile.used{opacity:.3}
  .ed-slots{display:flex;gap:6px;justify-content:center;min-height:50px;margin-bottom:6px}
  .ed-slot{width:42px;height:46px;border-radius:10px;border:2px dashed #94a3b8;display:grid;place-items:center;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.3rem}

</style>
</head>
<body>
<div class="kit-page" id="app">
  <div class="kit-top"><a href="../game-room/" class="kit-back">←</a><div class="kit-title">🗝️ Escape Room Daily</div></div>

  <div class="kit-hud"><span id="ed-theme"></span><span>⏱️ <b id="ed-time">0:00</b></span><span>🚪 Room <b id="ed-n">1</b>/5</span></div>
  <div class="kit-card"><div class="ed-digits" id="ed-digits"></div><div class="ed-room" id="ed-room"></div><div class="kit-sub" id="ed-msg" style="text-align:center;margin:8px 0 0;min-height:1.2em"></div>
  <div style="text-align:center"><button class="kit-btn alt" id="ed-hint" type="button">💡 Hint (+20s)</button></div></div>
  <div id="ed-overlay"></div>

</div>
<script src="../player.js"></script>
<script src="../firebase.js"></script>
<script src="../leaderboard.js"></script>
<script src="../skin.js"></script>
<script src="../juice.js"></script>
<script src="../mathville/generators.js"></script>
<script src="../question-pools.js?v=2"></script>
<script src="../gamekit.js"></script>
<script>AIGKit.mount({title:'Escape Room Daily',accent:'#0e7490',bg:'linear-gradient(180deg,#e0f4f7,#c2e3ea)'});</script>
<script src="script.js"></script>
</body>
</html>
