<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Zombie Math Defense — BrainBox</title>
<meta name="theme-color" content="#3f8f5f">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<style>

  .zd-field{position:relative;margin:0 14px 12px;height:186px;border-radius:18px;overflow:hidden;background:linear-gradient(90deg,#5a4a3a 0,#5a4a3a 9%,#8fbf6a 9%,#7fae5a 100%)}
  .zd-lane{position:absolute;left:0;right:0;height:62px;border-bottom:2px dashed rgba(0,0,0,.12)}
  .zd-base{position:absolute;left:0;top:0;bottom:0;width:9%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;z-index:2}
  .zd-z{position:absolute;font-size:1.9rem;line-height:1;transform:translate(-50%,-50%);transition:filter .1s;z-index:1}
  .zd-z.boss{font-size:2.8rem}
  .zd-z.hit{filter:brightness(2) drop-shadow(0 0 6px #fff)}
  .zd-z small{position:absolute;left:50%;top:-10px;transform:translateX(-50%);font-size:.6rem;font-weight:800;background:#e4572e;color:#fff;border-radius:6px;padding:0 4px}
  .zd-shot{position:absolute;height:4px;border-radius:4px;background:#ffd23f;box-shadow:0 0 8px #ffd23f;z-index:3;transition:width .18s ease-out,opacity .3s}
  .zd-banner{position:absolute;inset:0;display:grid;place-items:center;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.6rem;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5);pointer-events:none;z-index:5}

</style>
</head>
<body>
<div class="kit-page" id="app">
  <div class="kit-top"><a href="../game-room/" class="kit-back">←</a><div class="kit-title">🧟 Zombie Math Defense</div></div>

  <div class="kit-hud"><span id="zd-hp">❤️❤️❤️❤️❤️</span><span>🌊 Wave <b id="zd-wave">1</b></span><span>🧟 <b id="zd-kills">0</b></span></div>
  <div class="zd-field" id="zd-field"><div class="zd-base">🏠</div><div class="zd-lane" style="top:0"></div><div class="zd-lane" style="top:62px"></div><div class="zd-lane" style="top:124px;border:0"></div><div class="zd-banner" id="zd-banner"></div></div>
  <div class="kit-card"><div class="kit-q" id="zd-q">…</div><div class="kit-opts" id="zd-opts"></div><div class="kit-sub" id="zd-msg" style="text-align:center;margin:8px 0 0;min-height:1.2em"></div></div>
  <div id="zd-overlay"></div>

</div>
<script src="../player.js"></script>
<script src="../firebase.js"></script>
<script src="../leaderboard.js"></script>
<script src="../skin.js"></script>
<script src="../juice.js"></script>
<script src="../mathville/generators.js"></script>
<script src="../question-pools.js?v=2"></script>
<script src="../gamekit.js"></script>
<script>AIGKit.mount({title:'Zombie Math Defense',accent:'#3f8f5f',bg:'linear-gradient(180deg,#e6f5dc,#c9e8b8)'});</script>
<script src="script.js"></script>
</body>
</html>
