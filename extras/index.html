<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Extras — BrainBox</title>
<meta name="theme-color" content="#8c2f6b">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: linear-gradient(180deg, #FDF0F7 0%, #F3E9FC 100%); font-family: "Nunito", sans-serif; color: #3d2e22; }
  .ex-page { max-width: 480px; margin: 0 auto; min-height: 100dvh; padding-bottom: 40px; }
  .ex-topbar { display: flex; align-items: center; gap: 10px; padding: 14px 14px 8px; }
  .ex-back { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #8c2f6b; font-size: 1.05rem; display: grid; place-items: center; box-shadow: 0 3px 8px rgba(0,0,0,.1); text-decoration: none; flex: none; }
  .ex-title { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1.05rem; flex: 1; text-align: center; color: #8c2f6b; }
  .ex-wallet { background: #fff; border-radius: 100px; padding: 6px 12px; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: .82rem; box-shadow: 0 2px 0 rgba(0,0,0,.05); white-space: nowrap; }
  .ex-card { margin: 0 16px 14px; background: #fff; border-radius: 18px; padding: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.05); }
  .ex-card h2 { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1rem; margin: 0 0 4px; }
  .ex-sub { font-weight: 700; color: #8a7a6a; font-size: .76rem; margin: 0 0 10px; line-height: 1.35; }
  .ex-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ex-btn { border: none; background: linear-gradient(135deg, #ffe9a8, #f7c548); color: #3d2e22; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: .85rem; padding: 9px 16px; border-radius: 100px; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,.08); }
  .ex-btn:disabled { opacity: .45; cursor: default; }
  .ex-btn.alt { background: #eee4f7; color: #6b3f9b; }
  .ex-stat { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1.1rem; }
  .ex-msg { font-weight: 800; font-size: .8rem; color: #6b3f9b; min-height: 1.1em; margin-top: 8px; }
  .ex-chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .ex-item { flex: 1 1 100px; border: 2px solid transparent; background: #fdf6ea; border-radius: 14px; padding: 10px 8px; text-align: center; cursor: pointer; font-family: "Nunito", sans-serif; }
  .ex-item.armed { border-color: #8c2f6b; background: #f6e3f0; }
  .ex-item-emoji { font-size: 1.6rem; }
  .ex-item-name { font-weight: 800; font-size: .78rem; }
  .ex-item-own { font-weight: 700; font-size: .68rem; color: #8a7a6a; }
  .ex-input { width: 80px; border: 2px solid #eadff5; border-radius: 10px; padding: 7px 8px; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: .9rem; }
  /* Lucky Wheel */
  .ex-wheel-wrap { position: relative; width: 210px; height: 210px; margin: 6px auto 12px; }
  .ex-wheel { width: 100%; height: 100%; border-radius: 50%; border: 6px solid #8c2f6b; transition: transform 4s cubic-bezier(.12,.72,.15,1);
    background: conic-gradient(#ffd6e8 0 45deg, #c1e1f6 45deg 90deg, #fff0b3 90deg 135deg, #c1f0e8 135deg 180deg, #d9c1f6 180deg 225deg, #ffd9b3 225deg 270deg, #c1e1c1 270deg 315deg, #eee 315deg 360deg); position: relative; }
  .ex-wheel span { position: absolute; left: 50%; top: 50%; font-size: 1rem; font-weight: 800; font-family: "Baloo 2", sans-serif; transform-origin: 0 0; white-space: nowrap; }
  .ex-pointer { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); font-size: 1.6rem; z-index: 2; }
  .ex-prize { text-align: center; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1.05rem; min-height: 1.4em; }
  .ex-empty { text-align: center; color: #8a7a6a; font-weight: 700; padding: 10px 0; font-size: .82rem; }
</style>
</head>
<body>
<div class="ex-page" id="ex-page">
  <div class="ex-topbar">
    <a href="../" class="ex-back">←</a>
    <div class="ex-title">🎁 Extras</div>
    <div class="ex-wallet" id="ex-wallet">🪙 0 &nbsp;💎 0</div>
  </div>

  <div id="ex-sections"></div>
</div>

<script src="../player.js"></script>
<script src="../firebase.js"></script>
<script src="../leaderboard.js"></script>
<script src="../skin.js"></script>
<script src="script.js"></script>
</body>
</html>
