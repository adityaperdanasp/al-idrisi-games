<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Game Room — BrainBox</title>
<meta name="theme-color" content="#5b3f9b">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<style>
  .gr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
  .gr-card{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:18px;padding:14px 10px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.07);border:2px solid transparent}
  .gr-card:active{transform:scale(.97)}
  .gr-emoji{font-size:2.3rem;display:block}
  .gr-name{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:.98rem;display:block;margin-top:2px}
  .gr-desc{font-weight:700;font-size:.72rem;color:#7a6a5a;display:block;line-height:1.3;margin-top:2px}
  .gr-tag{display:inline-block;font-size:.62rem;font-weight:800;background:#efe6ff;color:#5b3f9b;border-radius:100px;padding:1px 8px;margin-top:6px}
  .gr-tabs{display:flex;gap:8px;justify-content:center;padding:6px 14px 2px}
  .gr-tab{flex:1;max-width:200px;border:3px solid #1b1b1b;background:#ecdcb0;padding:10px 6px;font-weight:800;font-size:.9rem;cursor:pointer}
  .gr-tab.on{background:#5fb83a;color:#fff}
  .gr-sec{font-family:"Baloo 2",sans-serif;font-weight:800;padding:12px 16px 6px;color:#5b3f9b}
</style>
<link rel="stylesheet" href="/blockworld-games.css?v=6" />
<script>document.documentElement.classList.add("bw-g");document.documentElement.dataset.bw="game-room";</script>
</head>
<body>
<div class="kit-page" id="app">
  <div class="kit-top"><a href="../" class="kit-back">←</a><div class="kit-title">🎮 Game Room</div></div>
  <div class="kit-sub" style="text-align:center;padding:0 20px">Brand-new mini-games. Every right answer earns coins — and each game pays a small bonus twice a day.</div>
  <div class="gr-tabs" id="gr-tabs"></div>
  <div id="gr-list"></div>
</div>
<script src="../player.js"></script>
<script src="../firebase.js"></script>
<script src="../leaderboard.js"></script>
<script src="../skin.js"></script>
<script src="../gamekit.js?v=4"></script>
<script>
AIGKit.mount({title:'Game Room',accent:'#5b3f9b',bg:'linear-gradient(180deg,#efe9fb,#dccff5)'});
const GAMES = [
  ["Action & Strategy", [
    ["dino-rider","🦖","Dino Rider","Run, jump and evolve your dino","Action"],
    ["sea-mission","⛵","Sea Mission","Sink sea monsters, dodge the waves","Action"],
    ["zombie-defense","🧟","Zombie Math Defense","Stop the zombies before they reach your house","Action"],
    ["times-rhythm","🎵","Times Rhythm","Tap the right answer to the beat","Rhythm"],
    ["card-race","🃏","Quiz Card Race","Uno-style card race against Bo-Bot","Cards"],
    ["dungeon","🗡️","Dungeon Crawler","Pick a hero and explore the dungeon","RPG"],
    ["weekly-boss","🐉","Weekly Boss","The whole class raids one big boss","Class"]]],
  ["Think & Solve", [
    ["escape-daily","🧩","Daily Puzzle Rooms","5 rooms, one door code — new every day","Puzzle"],
    ["pattern-puzzles","🔷","Pattern Puzzles","Number, emoji and code puzzles","Logic"],
    ["word-detective","🕵️","Word Detective","Read the case, catch the culprit","Reading"],
    ["fractions-kitchen","🥣","Fractions Kitchen","Measure recipes with fractions","Fractions"],
    ["science-lab","🧪","Science Lab","Predict, then run the experiment","Science"]]],
  ["Explore & Build", [
    ["island-adventure","🏝️","Island Adventure","Sail to 4 islands and the volcano","Story"],
    ["geo-flight","🌍","Geo Flight","Fly the world, collect stamps","Geography"],
    ["my-town","🏘️","My Town","Build a town and visit friends","Build"],
    ["story-maker","📖","Story Maker","Choose the words — and the story","Writing"]]],
  ["Talk & Play Together", [
    ["duel","⚔️","Duel Arena","Challenge a friend to the same questions","Duel"],
    ["voice-quiz","🗣️","Voice Quiz","Answer out loud like a radio show","Speaking"],
    ["speak-with-bo","🎤","Speak with Bo","Read aloud karaoke-style","Speaking"]]]
];
// Learning tools and shops live in their own tab so the game list is only games.
const TOOLS = [
  ["bo-class","🎓","Bo's Classroom","Short lessons, then practice","Lessons"],
  ["bo-tutor","🧑‍🏫","Bo's Tutor Session","5 questions on your trickiest topic","Coaching"],
  ["quick-review","🔁","Quick Review","Missed questions come back on time","Review"],
  ["word-book","📕","Word Book","Your tricky Language words","Words"],
  ["ready-check","✅","Level-Up Check","Am I ready for the next topic?","Check"],
  ["zen-mode","🍃","Zen Mode","Calm practice, no timer","Calm"],
  ["music-corner","🎼","Music Corner","Turn facts into songs","Music"],
  ["garage","🔧","Vehicle Workshop","Upgrade and paint your vehicles","Upgrade"],
  ["workshop","✨","Crafting Table","Upgrade effects to Gold or Holo","Upgrade"],
  ["class-board","🏆","Class Team Board","Big-screen team scores","Class"]
];
const card = g => `<a class="gr-card" href="../${g[0]}/"><span class="gr-emoji">${g[1]}</span><span class="gr-name">${g[2]}</span><span class="gr-desc">${g[3]}</span><span class="gr-tag">${g[4]}</span></a>`;
let tab = "games"; try { tab = localStorage.getItem("gr_tab") || "games"; } catch (e) {}
function draw() {
  document.getElementById("gr-tabs").innerHTML = `<button type="button" class="gr-tab ${tab === "games" ? "on" : ""}" data-t="games">🎮 Games</button><button type="button" class="gr-tab ${tab === "tools" ? "on" : ""}" data-t="tools">📚 Learn &amp; Tools</button>`;
  document.querySelectorAll(".gr-tab").forEach(b => b.onclick = () => { tab = b.dataset.t; try { localStorage.setItem("gr_tab", tab); } catch (e) {} draw(); });
  document.getElementById("gr-list").innerHTML = tab === "games"
    ? GAMES.map(([sec, list]) => `<div class="gr-sec">${sec}</div><div class="gr-grid">${list.map(card).join("")}</div>`).join("")
    : `<div class="gr-sec">Learn, review &amp; upgrade</div><div class="gr-grid">${TOOLS.map(card).join("")}</div>`;
}
draw();
</script>
</body>
</html>
