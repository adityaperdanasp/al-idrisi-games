<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>Kids' Quiz — BrainBox</title>
<meta name="theme-color" content="#fdf6ea">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fdf6ea; font-family: "Nunito", sans-serif; color: #3d2e22; }
  .kq-page { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; }
  .kq-topbar { display: flex; align-items: center; gap: 10px; padding: 18px 16px 10px; }
  .kq-back { width: 36px; height: 36px; border-radius: 50%; background: #fff; color: #8c2f6b; font-size: 1.1rem; display: grid; place-items: center; box-shadow: 0 3px 8px rgba(0,0,0,.1); text-decoration: none; flex: none; }
  .kq-topbar h1 { font-family: "Baloo 2", sans-serif; font-size: 1.2rem; margin: 0; flex: 1; text-align: center; margin-right: 36px; }

  .kq-tabs { display: flex; gap: 8px; margin: 0 16px 16px; }
  .kq-tab { flex: 1; border: none; background: #f1ede6; color: #8a7a6a; font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: .85rem; padding: 10px; border-radius: 100px; cursor: pointer; }
  .kq-tab.active { background: #3d2e22; color: #fff; }

  .kq-panel { padding: 0 16px; }
  .kq-panel[hidden] { display: none; }

  .kq-card { background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 3px 0 rgba(0,0,0,.05); margin-bottom: 16px; }
  .kq-btn { display: block; width: 100%; border: none; border-radius: 14px; padding: 14px; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: .95rem; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .kq-btn-primary { background: #E4572E; color: #fff; }
  .kq-btn-secondary { background: #f1ede6; color: #3d2e22; margin-top: 10px; }
  .kq-empty { text-align: center; color: #8a7a6a; font-weight: 700; padding: 20px 0; }

  .kq-qnum { font-weight: 700; font-size: .8rem; color: #8a7a6a; margin-bottom: 8px; }
  .kq-prompt { font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 1.05rem; margin-bottom: 16px; }
  .kq-option { display: block; width: 100%; text-align: left; border: 2px solid #f1ede6; background: #fff; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; font-family: "Nunito", sans-serif; font-weight: 700; font-size: .9rem; cursor: pointer; }
  .kq-option.correct { border-color: #3F8F5F; background: #eaf7ee; }
  .kq-option.wrong { border-color: #D64545; background: #fdeaea; }
  .kq-option:disabled { cursor: default; }

  .kq-result-emoji { text-align: center; font-size: 48px; }
  .kq-result-title { text-align: center; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1.3rem; margin: 8px 0; }
  .kq-author { font-size: .72rem; color: #8a7a6a; margin-top: -10px; margin-bottom: 14px; }

  .kq-field { margin-bottom: 12px; }
  .kq-field label { display: block; font-weight: 700; font-size: .8rem; color: #8a7a6a; margin-bottom: 5px; }
  .kq-field input[type=text] { width: 100%; padding: 11px 12px; border-radius: 12px; border: 2px solid #f1ede6; font-family: "Nunito", sans-serif; font-size: .9rem; }
  .kq-option-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .kq-option-row input[type=text] { flex: 1; }

  .kq-mylist { display: flex; flex-direction: column; gap: 10px; }
  .kq-myitem { background: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: 0 2px 0 rgba(0,0,0,.04); }
  .kq-myitem-prompt { font-weight: 700; font-size: .88rem; margin-bottom: 4px; }
  .kq-status { font-size: .72rem; font-weight: 800; padding: 2px 8px; border-radius: 100px; display: inline-block; }
  .kq-status-pending { background: #fdf1cf; color: #8a6a1e; }
  .kq-status-approved { background: #e2f3e5; color: #2f6b3a; }
  .kq-status-rejected { background: #fbe3e3; color: #a13a3a; }
  .kq-pick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;font-weight:800;font-size:.8rem}.kq-pick select{font:inherit;padding:5px;border:2px solid #1b1b1b}
  .kq-after{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .kq-mini{border:2px solid #1b1b1b;background:#fff;padding:6px 10px;font-weight:800;font-size:.78rem;cursor:pointer}
  .kq-hall{margin-top:12px;text-align:left;font-size:.82rem;display:grid;gap:4px;background:#fff8e1;border:2px solid #1b1b1b;padding:8px}
  .kq-tpl{display:flex;flex-wrap:wrap;gap:6px}
  .kq-preview{margin:10px 0}.kq-pv-h{font-weight:800;font-size:.8rem;margin-bottom:4px}
  .kq-creator{background:#fff;border:2px solid #1b1b1b;padding:8px;margin-bottom:8px;font-size:.85rem}
  .kq-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.kq-badges span{border:2px dashed #bbb;padding:2px 6px;font-size:.72rem;font-weight:800;opacity:.5}.kq-badges span.on{border:2px solid #b8860b;background:#fff3c4;opacity:1}
</style>

<body>

<div class="kq-page">
  <div class="kq-topbar">
    <a href="../" class="kq-back">←</a>
    <h1>🎨 Kids' Quiz</h1>
  </div>

  <div class="kq-tabs">
    <button class="kq-tab active" id="kq-tab-play" type="button">🎲 Play</button>
    <button class="kq-tab" id="kq-tab-mine" type="button">✏️ My Questions</button>
  </div>

  <!-- PLAY -->
  <div class="kq-panel" id="kq-panel-play">
    <div class="kq-card" id="kq-play-intro">
      <div class="kq-empty">Answer quiz questions written by other kids at your school! Approved questions only.</div>
      <div class="kq-pick"><label>Whose questions? <select id="kq-friend"><option value="">Everyone</option></select></label><label>Topic <select id="kq-cat"><option value="">All topics</option></select></label></div>
      <button class="kq-btn kq-btn-primary" id="kq-start-btn">Start Quiz</button>
      <div id="kq-hall"></div>
    </div>
    <div class="kq-card" id="kq-play-question" hidden>
      <div class="kq-qnum" id="kq-qnum"></div>
      <div class="kq-author" id="kq-author"></div>
      <div class="kq-prompt" id="kq-prompt"></div>
      <div id="kq-options"></div>
      <div class="kq-after" id="kq-after" hidden><button class="kq-mini" id="kq-like" type="button">💖 Like this question</button><button class="kq-mini" id="kq-report" type="button">⚑ Something's wrong</button><button class="kq-btn kq-btn-primary" id="kq-next" type="button">Next ▶</button></div>
    </div>
    <div class="kq-card" id="kq-play-result" hidden>
      <div class="kq-result-emoji">🏁</div>
      <div class="kq-result-title" id="kq-result-title"></div>
      <button class="kq-btn kq-btn-primary" id="kq-play-again-btn">Play Again</button>
    </div>
  </div>

  <!-- MY QUESTIONS -->
  <div class="kq-panel" id="kq-panel-mine" hidden>
    <div class="kq-card">
      <div class="kq-field"><label>Need an idea? Tap a template</label><div class="kq-tpl" id="kq-tpl"></div></div>
      <div class="kq-field"><label>Topic</label><select id="kq-new-cat"><option value="math">➗ Maths</option><option value="words">📖 Words</option><option value="science">🔭 Science</option><option value="animals">🐾 Animals</option><option value="space">🚀 Space</option><option value="games">🎮 Games</option><option value="general">⭐ Anything</option></select></div>
      <div class="kq-field">
        <label>Your question</label>
        <input type="text" id="kq-new-prompt" placeholder="e.g. What is 7 x 8?" maxlength="120">
      </div>
      <div class="kq-field">
        <label>4 answer choices (tap the circle next to the correct one)</label>
        <div id="kq-new-options"></div>
      </div>
      <div class="kq-preview" id="kq-preview"></div>
      <button class="kq-btn kq-btn-primary" id="kq-submit-btn">Submit for Approval</button>
      <div class="kq-empty" id="kq-submit-msg" style="display:none;"></div>
    </div>
    <div class="kq-mylist" id="kq-mylist"></div>
  </div>
</div>

<script src="../player.js"></script>
<script src="../firebase.js"></script>
<script src="../leaderboard.js"></script>
<script>
  const player = window.AIGPlayer && AIGPlayer.getPlayer();
  if (!player || player.role === "parent") {
    document.querySelector(".kq-page").innerHTML =
      '<div class="kq-topbar"><a href="../" class="kq-back">←</a><h1>🎨 Kids\' Quiz</h1></div>' +
      '<div class="kq-panel"><div class="kq-card"><div class="kq-empty">Please sign in from the hub first.</div></div></div>';
  } else {
    initKidsQuiz();
  }

  function initKidsQuiz() {
    // ---- Tabs ----
    document.getElementById("kq-tab-play").addEventListener("click", () => switchTab("play"));
    document.getElementById("kq-tab-mine").addEventListener("click", () => switchTab("mine"));
    function switchTab(tab) {
      document.getElementById("kq-tab-play").classList.toggle("active", tab === "play");
      document.getElementById("kq-tab-mine").classList.toggle("active", tab === "mine");
      document.getElementById("kq-panel-play").hidden = tab !== "play";
      document.getElementById("kq-panel-mine").hidden = tab !== "mine";
      if (tab === "mine") renderMyQuestions();
    }

    // ---- Play ----
    let quizQueue = [];
    let quizIndex = 0;
    let quizScore = 0, likedThisRound = 0;
    const CAT_LABEL = { math: "➗ Maths", words: "📖 Words", science: "🔭 Science", animals: "🐾 Animals", space: "🚀 Space", games: "🎮 Games", general: "⭐ Anything" };
    // Audit batch 3: friend/topic filters + a "most liked" hall, filled once on load.
    (async () => { try {
      const pool = await AIGLeaderboard.getApprovedCustomQuestionPool();
      const authors = {}; pool.forEach(q => { authors[q.authorId] = q.authorName || q.authorId; });
      document.getElementById("kq-friend").innerHTML = '<option value="">Everyone</option>' + Object.entries(authors).map(([id, n]) => `<option value="${escapeHtml(id)}">${escapeHtml(n)}'s questions</option>`).join("");
      const cats = [...new Set(pool.map(q => q.category || "general"))];
      document.getElementById("kq-cat").innerHTML = '<option value="">All topics</option>' + cats.map(c => `<option value="${c}">${CAT_LABEL[c] || c}</option>`).join("");
      const top = pool.map(q => ({ q, likes: q.likes ? Object.keys(q.likes).length : 0 })).filter(x => x.likes).sort((a, b) => b.likes - a.likes).slice(0, 5);
      document.getElementById("kq-hall").innerHTML = top.length ? `<div class="kq-hall"><b>🏆 Most liked questions</b>${top.map(x => `<div>💖 ${x.likes} · “${escapeHtml(x.q.prompt)}” <small>by ${escapeHtml(x.q.authorName || "a classmate")}</small></div>`).join("")}</div>` : "";
    } catch (e) {} })();

    document.getElementById("kq-start-btn").addEventListener("click", startQuiz);
    document.getElementById("kq-play-again-btn").addEventListener("click", startQuiz);

    async function startQuiz() {
      document.getElementById("kq-play-result").hidden = true;
      const startBtn = document.getElementById("kq-start-btn");
      const emptyEl = document.getElementById("kq-play-intro").querySelector(".kq-empty");
      startBtn.disabled = true;
      startBtn.textContent = "Checking…"; // visible feedback that the tap registered, not just a near-instant no-op
      try {
        let pool = await AIGLeaderboard.getApprovedCustomQuestionPool();
        const fr = document.getElementById("kq-friend").value, ct = document.getElementById("kq-cat").value;
        if (fr) pool = pool.filter(q => q.authorId === fr); if (ct) pool = pool.filter(q => (q.category || "general") === ct);
        likedThisRound = 0;
        if (!pool.length) {
          document.getElementById("kq-play-intro").hidden = false;
          emptyEl.textContent =
            "No approved questions yet -- write one in \"My Questions\" and ask a parent to approve it!";
          return;
        }
        document.getElementById("kq-play-intro").hidden = true;
        quizQueue = shuffle(pool).slice(0, Math.min(10, pool.length));
        quizIndex = 0;
        quizScore = 0;
        renderQuizStep();
      } catch (e) {
        // A thrown/rejected fetch (flaky connection) must never leave the
        // button stuck disabled forever -- the finally block below always
        // restores it, this just shows a distinct message so "couldn't
        // check" doesn't look identical to "checked, nothing there".
        document.getElementById("kq-play-intro").hidden = false;
        emptyEl.textContent = "Couldn't check for questions -- check your connection and try again.";
      } finally {
        startBtn.disabled = false;
        startBtn.textContent = "Start Quiz";
      }
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function renderQuizStep() {
      const q = quizQueue[quizIndex];
      document.getElementById("kq-play-question").hidden = false;
      document.getElementById("kq-qnum").textContent = `Question ${quizIndex + 1} of ${quizQueue.length}`;
      const openBounty = q.bounty && q.bounty.amount && !q.bounty.claimedBy;
      document.getElementById("kq-author").textContent = `Written by ${q.authorName || "a classmate"}` + (openBounty ? ` · 💰 ${q.bounty.amount} coin bounty!` : "");
      document.getElementById("kq-prompt").textContent = q.prompt;
      const wrap = document.getElementById("kq-options");
      wrap.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "kq-option";
        btn.textContent = opt;
        btn.addEventListener("click", () => {
          const isCorrect = i === q.correctIndex;
          if (isCorrect) quizScore++;
          try { AIGLeaderboard.kidsQuizStat(q.authorId, q.id, isCorrect); } catch (e) {}
          // Question Bounty (PM round 9, item 9): first correct classmate
          // takes the author's pot. Best-effort -- never blocks the quiz.
          if (isCorrect && openBounty && AIGLeaderboard.claimQuestionBounty) {
            AIGLeaderboard.claimQuestionBounty(q.authorId, q.id).then(r => {
              if (r && r.ok) document.getElementById("kq-author").textContent = `💰 You won the ${r.amount}-coin bounty!`;
            }).catch(() => {});
          }
          wrap.querySelectorAll(".kq-option").forEach((b, bi) => {
            b.disabled = true;
            if (bi === q.correctIndex) b.classList.add("correct");
            else if (bi === i) b.classList.add("wrong");
          });
          const after = document.getElementById("kq-after"); after.hidden = false;
          const lk = document.getElementById("kq-like"), rp = document.getElementById("kq-report");
          lk.disabled = false; lk.textContent = "💖 Like this question"; rp.disabled = false; rp.textContent = "⚑ Something's wrong";
          lk.onclick = async () => { lk.disabled = true; lk.textContent = "💖 Liked!"; likedThisRound++; try { await AIGLeaderboard.kidsQuizLike(q.authorId, q.id); } catch (e) {} };
          rp.onclick = async () => { rp.disabled = true; rp.textContent = "⚑ Sent to a parent"; try { await AIGLeaderboard.kidsQuizReport(q.authorId, q.id, "flagged by a player"); } catch (e) {} };
          document.getElementById("kq-next").onclick = () => {
            after.hidden = true; quizIndex++;
            if (quizIndex < quizQueue.length) renderQuizStep(); else finishQuiz();
          };
        });
        wrap.appendChild(btn);
      });
    }

    function finishQuiz() {
      document.getElementById("kq-play-question").hidden = true;
      document.getElementById("kq-play-result").hidden = false;
      document.getElementById("kq-result-title").textContent = `You got ${quizScore}/${quizQueue.length}!` + (likedThisRound ? ` You liked ${likedThisRound} question${likedThisRound > 1 ? "s" : ""} — the authors earn a coin for each like!` : "");
    }

    // ---- My Questions ----
    const OPTION_COUNT = 4;
    let correctChoice = 0;
    function renderNewOptionInputs() {
      const wrap = document.getElementById("kq-new-options");
      wrap.innerHTML = "";
      for (let i = 0; i < OPTION_COUNT; i++) {
        const row = document.createElement("div");
        row.className = "kq-option-row";
        row.innerHTML = `
          <input type="radio" name="kq-correct" value="${i}" ${i === 0 ? "checked" : ""}>
          <input type="text" placeholder="Choice ${i + 1}" maxlength="60" data-opt-input="${i}">
        `;
        wrap.appendChild(row);
      }
      wrap.querySelectorAll('input[name="kq-correct"]').forEach(r => {
        r.addEventListener("change", () => { correctChoice = Number(r.value); });
      });
    }
    renderNewOptionInputs();

    // Small blocklist check before it ever reaches a parent's approval
    // queue -- a parent still reviews every question regardless (nothing
    // shows to other kids until approved), so this is a friendly "please
    // rephrase" nudge, not a security boundary.
    const KQ_BLOCKED_WORDS = ["anjing", "bangsat", "goblok", "tolol", "kontol", "memek", "babi", "bego", "idiot", "stupid", "damn", "hell", "fuck", "shit", "bitch"];
    function kqContainsBlockedWord(text) {
      const lower = text.toLowerCase();
      return KQ_BLOCKED_WORDS.some(w => lower.includes(w));
    }

    document.getElementById("kq-submit-btn").addEventListener("click", async () => {
      const prompt = document.getElementById("kq-new-prompt").value.trim();
      const options = Array.from(document.querySelectorAll("[data-opt-input]")).map(i => i.value.trim());
      const msg = document.getElementById("kq-submit-msg");
      msg.style.display = "block";
      if (!prompt || options.some(o => !o)) {
        msg.textContent = "Please fill in the question and all 4 choices.";
        return;
      }
      if (kqContainsBlockedWord(prompt) || options.some(kqContainsBlockedWord)) {
        msg.textContent = "Please use kind, school-friendly words in your question.";
        return;
      }
      const submitBtn = document.getElementById("kq-submit-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting…";
      // try/catch/finally so a thrown/rejected Firebase call (flaky
      // connection) can never leave this button stuck disabled forever --
      // the exact bug already fixed once on the Start Quiz button above.
      try {
        const result = await AIGLeaderboard.submitCustomQuestion(prompt, options, correctChoice, document.getElementById("kq-new-cat").value);
        if (!result.ok) {
          msg.textContent = result.reason === "too-many-pending"
            ? "You already have a lot of questions waiting for approval -- wait for a parent to review some first!"
            : "Couldn't submit -- check your connection and try again.";
          return;
        }
        msg.textContent = "Submitted! A parent needs to approve it before others can play it.";
        document.getElementById("kq-new-prompt").value = "";
        document.querySelectorAll("[data-opt-input]").forEach(i => i.value = "");
        correctChoice = 0;
        renderNewOptionInputs();
        renderMyQuestions();
      } catch (e) {
        msg.textContent = "Couldn't submit -- check your connection and try again.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit for Approval";
      }
    });

    async function renderMyQuestions() {
      const mine = await AIGLeaderboard.getMyCustomQuestions();
      const list = document.getElementById("kq-mylist");
      mine.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      const approved = mine.filter(q => q.status === "approved").length, plays = mine.reduce((a, q) => a + ((q.stats && q.stats.plays) || 0), 0), likes = mine.reduce((a, q) => a + (q.likes ? Object.keys(q.likes).length : 0), 0);
      const badges = [[approved >= 1, "✍️ First question"], [approved >= 10, "📚 10 approved"], [plays >= 50, "🎮 50 plays"], [plays >= 100, "🏟️ 100 plays"], [likes >= 10, "💖 10 likes"]];
      list.innerHTML = `<div class="kq-creator"><b>🎨 Creator stats</b> · ${approved} approved · ${plays} plays · ${likes} likes<div class="kq-badges">${badges.map(([ok, l]) => `<span class="${ok ? "on" : ""}">${l}</span>`).join("")}</div></div>` + (mine.map(q => {
        const st = q.stats || {}, pct = st.plays ? Math.round((st.correct || 0) / st.plays * 100) : null, lk = q.likes ? Object.keys(q.likes).length : 0;
        return `<div class="kq-myitem"><div class="kq-myitem-prompt">${escapeHtml(q.prompt)}<br><small>${CAT_LABEL[q.category || "general"] || ""}${st.plays ? ` · 🎮 ${st.plays} plays · ✅ ${pct}% got it right` : ""}${lk ? ` · 💖 ${lk}` : ""}${q.reports ? " · ⚑ flagged — a parent will check" : ""}</small></div><span class="kq-status kq-status-${q.status}">${q.status}</span></div>`;
      }).join("") || '<div class="kq-empty">You haven\'t written any questions yet.</div>');
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // templates + live preview
    const TPL = [["➗", "What is 7 × 8?", ["56", "54", "64", "48"], "math"], ["📖", "Which word means the opposite of HAPPY?", ["Sad", "Glad", "Jolly", "Merry"], "words"], ["🔭", "Which planet is closest to the Sun?", ["Mercury", "Venus", "Earth", "Mars"], "science"], ["🐾", "Which animal is a mammal?", ["Whale", "Shark", "Frog", "Eagle"], "animals"]];
    document.getElementById("kq-tpl").innerHTML = TPL.map((t, i) => `<button type="button" class="kq-mini" data-tpl="${i}">${t[0]} ${escapeHtml(t[1])}</button>`).join("");
    document.querySelectorAll("[data-tpl]").forEach(b => b.onclick = () => { const t = TPL[+b.dataset.tpl]; document.getElementById("kq-new-prompt").value = t[1]; document.querySelectorAll("[data-opt-input]").forEach((inp, i) => inp.value = t[2][i]); document.getElementById("kq-new-cat").value = t[3]; correctChoice = 0; const r = document.querySelector('input[name="kq-correct"][value="0"]'); if (r) r.checked = true; preview(); });
    function preview() {
      const p = document.getElementById("kq-new-prompt").value.trim(), opts = Array.from(document.querySelectorAll("[data-opt-input]")).map(i => i.value.trim());
      document.getElementById("kq-preview").innerHTML = p ? `<div class="kq-pv-h">👀 Preview</div><div class="kq-prompt">${escapeHtml(p)}</div>${opts.map((o, i) => `<div class="kq-option ${i === correctChoice ? "correct" : ""}" style="pointer-events:none">${escapeHtml(o || "…")}</div>`).join("")}` : "";
    }
    document.getElementById("kq-panel-mine").addEventListener("input", preview);
    document.getElementById("kq-panel-mine").addEventListener("change", preview);
    renderMyQuestions();
  }
</script>
