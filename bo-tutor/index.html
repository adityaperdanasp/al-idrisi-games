<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<script src="../tablet.js?v=1"></script>
<title>Bo's Tutor Session — BrainBox</title>
<meta name="theme-color" content="#6d28d9">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<style>

  .bt-bo{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .bt-bo img{width:52px;height:52px;border-radius:14px}
  .bt-say{background:#f3ecff;border-radius:14px;padding:10px 12px;font-weight:700;font-size:.86rem;line-height:1.45;flex:1}
  .bt-topic{display:flex;justify-content:space-between;align-items:center;width:100%;border:2px solid rgba(0,0,0,.08);background:#faf6ff;border-radius:14px;padding:12px;font-family:"Baloo 2",sans-serif;font-weight:800;cursor:pointer;color:inherit;margin-bottom:8px;text-align:left}
  .bt-topic small{color:#7a6a5a;font-weight:700}
  .bt-stars{text-align:center;font-size:1.6rem;letter-spacing:6px;margin-bottom:6px}

  .bt-acc{display:block;height:6px;background:#eee;border:1px solid #1b1b1b;margin-top:4px}.bt-acc i{display:block;height:100%;background:#e0952f}
  .bt-more summary{cursor:pointer;font-weight:800;margin:10px 0 6px}
  .bt-board{background:#2f5d3a;color:#f4f4e8;border:4px solid #8a5a34;padding:12px;margin-bottom:10px}.bt-board .kit-q{color:#fff}
  .bt-cert{border:4px double #b8860b;background:#fffbe6;padding:12px;margin:0 0 12px;font-weight:700;line-height:1.5}
  .bt-cards{border:2px dashed #1b1b1b;background:#fffbe6;padding:6px 8px;margin:0 0 8px;font-weight:800;font-size:.85rem}.bt-cards small{font-weight:600;opacity:.75}
</style>
<link rel="stylesheet" href="/blockworld-games.css?v=6" />
<script>document.documentElement.classList.add("bw-g");document.documentElement.dataset.bw="bo-tutor";</script>
</head>
<body>
<div class="kit-page" id="app">
  <div class="kit-top"><a href="../game-room/" class="kit-back">←</a><div class="kit-title">🎓 Bo's Tutor Session</div></div>

  <div class="kit-card"><div class="bt-bo"><img src="../icon-192.png" alt="Bo"><div class="bt-say" id="bt-say">Hi! Let me look at what you've been practicing…</div></div><div id="bt-body"></div></div>
  <div id="bt-overlay"></div>

</div>
<script src="../player.js"></script>
<script src="../firebase.js"></script>
<script src="../leaderboard.js?v=5"></script>
<script src="../skin.js"></script>
<script src="../juice.js"></script>
<script src="../mathville/generators.js?v=8"></script>
<script src="../question-pools.js?v=4"></script>
<script src="../gamekit.js?v=6"></script>
<script>AIGKit.mount({title:"Bo's Tutor Session",accent:'#6d28d9',bg:'linear-gradient(180deg,#efe9fb,#e0d4f7)'});</script>
<script src="script.js?v=4"></script>
</body>
</html>
