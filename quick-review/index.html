<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Quick Review — BrainBox</title>
<meta name="theme-color" content="#0f766e">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<style>

  .qr-step{display:inline-block;font-size:.66rem;font-weight:800;background:#ccfbf1;color:#0f766e;border-radius:100px;padding:1px 8px;margin-bottom:6px}

  .qr-shelf{margin:0 14px 12px;background:#fff;border:3px solid #1b1b1b;padding:8px 10px;font-size:.9rem}
  .qr-sp{display:block;text-align:center;font-weight:800;font-size:.82rem;margin-top:6px}
  .qr-torches{display:flex;justify-content:center;gap:4px;font-size:1.1rem}.qr-torches i{font-style:normal;opacity:.6}.qr-torches i.lit{opacity:1}
  .qr-mob{font-size:3rem;text-align:center;animation:qrBob 1.4s ease-in-out infinite}
  .qr-mob.flee{animation:qrFlee .6s forwards}.qr-mob.stay{animation:qrStay .4s 2}
  @keyframes qrBob{50%{transform:translateY(-6px)}}@keyframes qrFlee{to{transform:translateX(160px) rotate(25deg);opacity:0}}@keyframes qrStay{50%{transform:scale(1.2)}}
  body.qr-night{background:linear-gradient(180deg,#0b1030,#2a3a7a) !important}
  body.qr-night .kit-title,body.qr-night .kit-hud{color:#fff}
  body.qr-morning{background:linear-gradient(180deg,#ffd9a0,#bfe3ff) !important}
  .qr-subj{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}.qr-subj button{border:2px solid #1b1b1b;background:#fff;padding:5px 9px;font-weight:800;cursor:pointer}.qr-subj button.on{background:#6cc04a;color:#fff}.qr-subj small{opacity:.7}
</style>
<link rel="stylesheet" href="/blockworld-games.css?v=6" />
<script>document.documentElement.classList.add("bw-g");document.documentElement.dataset.bw="quick-review";</script>
</head>
<body>
<div class="kit-page" id="app">
  <div class="kit-top"><a href="../game-room/" class="kit-back">←</a><div class="kit-title">🔁 Quick Review</div></div>

  <div class="kit-hud"><span id="qr-hud"></span></div>
  <div id="qr-shelf"></div>
  <div class="kit-card" id="qr-card"></div>
  <div id="qr-overlay"></div>

</div>
<script src="../player.js"></script>
<script src="../firebase.js"></script>
<script src="../leaderboard.js?v=4"></script>
<script src="../skin.js"></script>
<script src="../juice.js"></script>
<script src="../mathville/generators.js?v=7"></script>
<script src="../question-pools.js?v=4"></script>
<script src="../gamekit.js?v=6"></script>
<script>AIGKit.mount({title:'Quick Review',accent:'#0f766e',bg:'linear-gradient(180deg,#d9f7f2,#b5ebe2)'});</script>
<script src="script.js?v=3"></script>
</body>
</html>
