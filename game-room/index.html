<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Game Room — BrainBox</title>
<meta name="theme-color" content="#5b3f9b">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<style>
  .gr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
  .gr-card{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:18px;padding:14px 10px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.07);border:2px solid transparent}
  .gr-card:active{transform:scale(.97)}
  .gr-emoji{font-size:2.3rem;display:block}
  .gr-name{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:.98rem;display:block;margin-top:2px}
  .gr-desc{font-weight:700;font-size:.72rem;color:#7a6a5a;display:block;line-height:1.3;margin-top:2px}
  .gr-tag{display:inline-block;font-size:.62rem;font-weight:800;background:#efe6ff;color:#5b3f9b;border-radius:100px;padding:1px 8px;margin-top:6px}
  .gr-sec{font-family:"Baloo 2",sans-serif;font-weight:800;padding:12px 16px 6px;color:#5b3f9b}
</style>
</head>
<body>
<div class="kit-page" id="app">
  <div class="kit-top"><a href="../" class="kit-back">←</a><div class="kit-title">🎮 Game Room</div></div>
  <div class="kit-sub" style="text-align:center;padding:0 20px">Brand-new mini-games. Every right answer earns coins — and each game pays a small bonus twice a day.</div>
  <div id="gr-list"></div>
</div>
<script src="../player.js"></script>
<script src="../firebase.js"></script>
<script src="../leaderboard.js"></script>
<script src="../skin.js"></script>
<script src="../gamekit.js"></script>
<script>
AIGKit.mount({title:'Game Room',accent:'#5b3f9b',bg:'linear-gradient(180deg,#efe9fb,#dccff5)'});
const GAMES = [
  ["Action & Strategy", [
    ["zombie-defense","🧟","Zombie Math Defense","Answer to shoot zombies before they reach your house","Action"],
    ["card-race","🃏","Quiz Card Race","Play cards by answering — first empty hand wins","Cards"],
    ["times-rhythm","🎵","Times Rhythm","Tap the right answer to the beat","Rhythm"],
    ["dungeon","🗡️","Dungeon Crawler","Choose a hero, fight monsters with knowledge","RPG"]]],
  ["Think & Solve", [
    ["fractions-kitchen","🥣","Fractions Kitchen","Measure recipes with fractions of a cup","Fractions"],
    ["word-detective","🕵️","Word Detective","Read the case, find the clues, catch the culprit","Reading"],
    ["escape-daily","🗝️","Escape Room Daily","5 rooms, one door code — new every day","Puzzle"],
    ["science-lab","🧪","Science Lab","Predict what happens, then watch the experiment","Science"]]],
  ["Explore & Build", [
    ["my-town","🏘️","My Town","Build your own town and visit friends","Build"],
    ["geo-flight","🌍","Geo Flight","Fly around the world, collect country stamps","Geography"]]],
  ["Talk, Write & Relax", [
    ["friend-duel","⚔️","Friend Duel","Challenge a friend — play any time, compare later","Duel"],
    ["story-maker","📖","Story Maker","Build a story with the right grammar","Writing"],
    ["speak-with-bo","🎤","Speak with Bo","Read English aloud and get a score","Speaking"],
    ["zen-mode","🍃","Zen Mode","No timer, no lives — just calm practice","Calm"],
    ["bo-tutor","🎓","Bo's Tutor Session","5 special questions on your trickiest topic","Coaching"]]]
];
const LIVE = new Set(["zombie-defense","card-race","fractions-kitchen","word-detective","escape-daily","times-rhythm","dungeon","science-lab","my-town","geo-flight"]);
document.getElementById("gr-list").innerHTML = GAMES.map(([sec, list]) => {
  const items = list.filter(g => LIVE.has(g[0]));
  if (!items.length) return "";
  return `<div class="gr-sec">${sec}</div><div class="gr-grid">${items.map(g => `<a class="gr-card" href="../${g[0]}/"><span class="gr-emoji">${g[1]}</span><span class="gr-name">${g[2]}</span><span class="gr-desc">${g[3]}</span><span class="gr-tag">${g[4]}</span></a>`).join("")}</div>`;
}).join("");
</script>
</body>
</html>
