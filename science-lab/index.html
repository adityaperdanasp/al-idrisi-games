<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Science Lab — BrainBox</title>
<meta name="theme-color" content="#0e7490">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<style>

  .sl-bench{background:linear-gradient(180deg,#f1f5f9,#e2e8f0);border-radius:16px;text-align:center;padding:14px 8px;margin-bottom:10px}
  .sl-scene{font-size:3rem;line-height:1.2;min-height:64px;letter-spacing:6px}
  .sl-scene.anim{animation:slPop .5s}
  @keyframes slPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  .sl-fact{background:#ecfeff;border:2px solid #67e8f9;border-radius:12px;padding:10px;font-weight:700;font-size:.85rem;line-height:1.45;margin-top:10px;text-align:left}

</style>
</head>
<body>
<div class="kit-page" id="app">
  <div class="kit-top"><a href="../game-room/" class="kit-back">←</a><div class="kit-title">🧪 Science Lab</div></div>

  <div class="kit-hud"><span>🧪 Experiment <b id="sl-n">1</b>/6</span><span>🔬 Right: <b id="sl-r">0</b></span></div>
  <div class="kit-card" id="sl-card"></div>
  <div id="sl-overlay"></div>

</div>
<script src="../player.js"></script>
<script src="../firebase.js"></script>
<script src="../leaderboard.js"></script>
<script src="../skin.js"></script>
<script src="../juice.js"></script>
<script src="../mathville/generators.js"></script>
<script src="../question-pools.js?v=2"></script>
<script src="../gamekit.js"></script>
<script>AIGKit.mount({title:'Science Lab',accent:'#0e7490',bg:'linear-gradient(180deg,#e0f7fa,#bfe9ef)'});</script>
<script src="script.js"></script>
</body>
</html>
