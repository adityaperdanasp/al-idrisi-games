<meta charset="UTF-8" />

<title>Level-Up Check — BrainBox</title>
<meta name="theme-color" content="#1d4ed8">

<style>

  .rc-topic{display:flex;justify-content:space-between;align-items:center;width:100%;border:2px solid rgba(0,0,0,.08);background:#faf6ff;border-radius:14px;padding:12px;font-family:"Baloo 2",sans-serif;font-weight:800;cursor:pointer;color:inherit;margin-bottom:8px;text-align:left}
  .rc-topic small{display:block;color:#7a6a5a;font-weight:700}
  .rc-topic.pass{background:#e5f5e8;border-color:#34c759}

  .rc-gate{display:inline-flex;align-items:center;gap:2px;font-size:1.3rem;margin-right:8px}.rc-gate b{font-size:1.1rem}
  .rc-st{font-size:.8rem;margin-left:6px;white-space:nowrap}
  .rc-boss{text-align:center;margin-bottom:6px}.rc-g{font-size:3rem;display:inline-block}
  .rc-g.hit{animation:rcHit .4s}.rc-g.atk{animation:rcAtk .4s}
  @keyframes rcHit{30%{transform:translateX(8px) rotate(8deg);filter:brightness(2)}}@keyframes rcAtk{50%{transform:scale(1.3)}}
  .rc-perf{display:block;text-align:center;font-weight:800;font-size:.8rem;margin:6px 0}.rc-topic.rc-next{box-shadow:0 0 0 3px #f5c400 inset;animation:rcGlow 1.2s infinite alternate}@keyframes rcGlow{to{box-shadow:0 0 0 3px #f5c400 inset,0 0 12px #f5c400}}
</style>
<link rel="stylesheet" href="/blockworld-games.css?v=6" />
<script>document.documentElement.classList.add("bw-g");document.documentElement.dataset.bw="ready-check";</script>
</head>

  <div id="rc-overlay"></div>

</div>
