<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>Workshop — BrainBox</title>
<meta name="theme-color" content="#a16207">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>

  .ws-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid #f5e7b8}
  .ws-row:first-child{border-top:0}
  .ws-e{font-size:1.8rem;width:44px;text-align:center}
  .ws-b{flex:1;min-width:0}.ws-n{font-family:"Baloo 2",sans-serif;font-weight:800}
  .ws-t{display:inline-block;font-size:.66rem;font-weight:800;border-radius:100px;padding:1px 8px;background:#e5e7eb;color:#374151}
  .ws-t.t2{background:#fde68a;color:#92400e}
  .ws-t.t3{background:linear-gradient(90deg,#f9a8d4,#a5b4fc,#86efac);color:#3b0764}
  .ws-h{font-family:"Baloo 2",sans-serif;font-weight:800;margin:6px 0 2px;color:#92400e}
  .ws-d{font-size:.7rem;color:#8a7a6a;font-weight:700}
  .ws-grid{display:grid;grid-template-columns:repeat(3,44px);gap:4px;justify-content:center;margin:0 0 12px}
  .ws-grid i{font-style:normal;width:44px;height:44px;display:grid;place-items:center;font-size:1.3rem;background:#8b8b8b;border:3px solid #373737;border-right-color:#fff;border-bottom-color:#fff}
  .ws-filters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 14px 10px}
  .ws-f{border:2px solid #1b1b1b;background:#fff;padding:5px 9px;font-weight:800;font-size:.75rem;cursor:pointer}
  .ws-f.on{background:#a16207;color:#fff}
  .ws-row.ready{background:#fff8d6}
  .ws-rd{font-size:.66rem;font-weight:800;color:#2f6a2f}
  .ws-q{font-size:.88rem}
  .ws-forge{position:relative;height:28px;background:#3a3a3a;border:3px solid #1b1b1b;margin:0 0 14px}
  .ws-forge .ws-zone{position:absolute;left:35%;width:30%;top:0;bottom:0;background:#e0952f}
  .ws-forge .ws-perf{position:absolute;left:46%;width:8%;top:0;bottom:0;background:#ffe45e}
  .ws-forge b{position:absolute;top:-6px;width:6px;height:34px;background:#fff;border:2px solid #111;transform:translateX(-50%)}

</style>
<link rel="stylesheet" href="/blockworld-games.css?v=5" />
<script>document.documentElement.classList.add("bw-g");document.documentElement.dataset.bw="workshop";</script>
</head>
<body>
<div class="kit-page" id="app">
  <div class="kit-top"><a href="../" class="kit-back">←</a><div class="kit-title">⚒️ Crafting Table</div></div>

  <div class="kit-hud"><span id="ws-wallet"></span></div>
  <div class="kit-card"><div class="kit-sub" style="margin:0">Take things you own to the next level: <b>Gold</b> (🪙60) makes them shine and bigger, <b>Holo</b> (💎3) makes them shimmer in rainbow colours. Effects, trails, stickers, themes, costumes, backgrounds and plane ammo can all be upgraded.</div></div>
  <div class="ws-grid" aria-hidden="true"><i>💎</i><i>🪙</i><i>✨</i><i>🪙</i><i>⚒️</i><i>🪙</i><i>✨</i><i>🪙</i><i>💎</i></div>
  <div id="ws-quest"></div>
  <div class="ws-filters" id="ws-filters"></div>
  <div id="ws-main"></div>
  <div id="ws-log"></div>

</div>
<script src="../player.js"></script>
<script src="../firebase.js"></script>
<script src="../leaderboard.js"></script>
<script src="../skin.js"></script>
<script src="../juice.js"></script>

<script src="../gamekit.js?v=4"></script>
<script>AIGKit.mount({title:'Crafting Table',accent:'#a16207',bg:'linear-gradient(180deg,#fff8dc,#ffe9a8)'});</script>
<script src="script.js?v=2"></script>
</body>
</html>
