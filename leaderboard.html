<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Leaderboard — BrainBox</title>
<meta name="theme-color" content="#eaf3ff">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="leaderboard.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

<div class="lb-page">
  <div class="lb-topbar">
    <a href="index.html" class="lb-back">←</a>
    <h1>Leaderboard</h1>
  </div>

  <div class="lb-scope-toggle" id="lb-scope-toggle">
    <button class="lb-scope-btn active" id="lb-scope-alltime" type="button">All-Time</button>
    <button class="lb-scope-btn" id="lb-scope-weekly" type="button">This Week 🔥</button>
    <button class="lb-scope-btn" id="lb-scope-speedround" type="button">⚡ Speed Round</button>
  </div>

  <div class="lb-tabs" id="lb-tabs"></div>

  <div class="lb-metric-label" id="lb-metric-label">Ranked by <b>🎮 times played</b></div>
  <div class="lb-hof-hint hidden" id="lb-hof-hint">🏆 This week's Hall of Fame! 📸 Screenshot to share with your family!</div>

  <div class="lb-podium" id="lb-podium"></div>
  <div class="lb-you hidden" id="lb-you"></div>
  <div class="lb-list" id="lb-list"></div>
  <div class="lb-empty hidden" id="lb-empty">No one has played this game yet. Be the first! 🎉</div>
</div>

<script src="player.js"></script>
<script src="leaderboard.js"></script>
<script>
  const GAMES = [
    { id: "mathrace", label: "Math Race", icon: "multipleazka/icon-512.png" },
    { id: "language-arts", label: "Lang & Arts", icon: "azkacraft/icons/icon-512.png" },
    { id: "solarquest", label: "SolarQuest", icon: "azkauniverse/icon-512.png" },
    { id: "mathville", label: "MathVille", icon: "mathville/icon.svg" }
  ];

  const AVATAR_COLORS = ["#1266d8", "#ff9ec4", "#a8d86b", "#f5c2e7", "#ffb020", "#7ea8e0", "#c98a4b", "#6dbf8b"];
  function colorFor(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function initials(name) {
    return (name.replace(/^(Ms\.|Mrs\.)\s*/, "")[0] || "?").toUpperCase();
  }

  let activeGame = GAMES[0].id;

  function renderTabs() {
    const wrap = document.getElementById("lb-tabs");
    wrap.innerHTML = "";
    GAMES.forEach(g => {
      const btn = document.createElement("button");
      btn.className = "lb-tab" + (g.id === activeGame ? " active" : "");
      btn.innerHTML = `<img src="${g.icon}" alt="">${g.label}`;
      btn.addEventListener("click", () => {
        activeGame = g.id;
        renderTabs();
        loadGame(g.id);
      });
      wrap.appendChild(btn);
    });
  }

  function render(data, scoreKey, scoreLabel) {
    scoreKey = scoreKey || "timesPlayed";
    scoreLabel = scoreLabel || "plays";
    const me = window.AIGPlayer && AIGPlayer.getPlayer();
    const entries = Object.keys(data).map(id => ({ id, ...data[id] }));
    entries.sort((a, b) => (b[scoreKey] || 0) - (a[scoreKey] || 0));

    const podiumEl = document.getElementById("lb-podium");
    const youEl = document.getElementById("lb-you");
    const listEl = document.getElementById("lb-list");
    const emptyEl = document.getElementById("lb-empty");
    podiumEl.innerHTML = "";
    listEl.innerHTML = "";

    if (entries.length === 0) {
      emptyEl.classList.remove("hidden");
      podiumEl.classList.add("hidden");
      youEl.classList.add("hidden");
      listEl.classList.add("hidden");
      return;
    }
    emptyEl.classList.add("hidden");
    podiumEl.classList.remove("hidden");
    listEl.classList.remove("hidden");

    const top3 = entries.slice(0, 3);
    // Visual podium order (silver, gold, bronze), independent of DOM order.
    const order = [1, 0, 2];
    const slotClass = ["second", "first", "third"];
    const medal = ["#2", "#1", "#3"];
    order.forEach((entryIdx, slotIdx) => {
      const e = top3[entryIdx];
      const slot = document.createElement("div");
      if (!e) {
        slot.className = "lb-p-slot " + slotClass[slotIdx] + " empty";
        podiumEl.appendChild(slot);
        return;
      }
      slot.className = "lb-p-slot " + slotClass[slotIdx];
      slot.innerHTML =
        `<div class="lb-p-avatar" style="background:${colorFor(e.id)};">${initials(e.name)}</div>` +
        `<div class="lb-p-name">${e.name}</div>` +
        `<div class="lb-p-score">${e[scoreKey] || 0} ${scoreLabel}</div>` +
        `<div class="lb-p-bar">${medal[slotIdx]}</div>`;
      podiumEl.appendChild(slot);
    });

    // "Posisi kamu" — only shown when the player isn't already on the podium
    // (top 3), since their spot is already visible up there.
    const myIdx = me ? entries.findIndex(e => e.id === me.id) : -1;
    if (myIdx >= 3) {
      const e = entries[myIdx];
      youEl.classList.remove("hidden");
      youEl.innerHTML =
        `<div class="rank">#${myIdx + 1}</div>` +
        `<div class="avatar">${initials(e.name)}</div>` +
        `<div class="info"><div class="label">Your position</div><div class="name">${e.name}</div></div>` +
        `<div class="score">${e[scoreKey] || 0} ${scoreLabel}</div>`;
    } else {
      youEl.classList.add("hidden");
    }

    entries.slice(3).forEach((e, i) => {
      const row = document.createElement("div");
      row.className = "lb-row";
      row.innerHTML =
        `<div class="rank">${i + 4}</div>` +
        `<div class="avatar" style="background:${colorFor(e.id)};">${initials(e.name)}</div>` +
        `<div class="name">${e.name}</div>` +
        `<div class="score">${e[scoreKey] || 0} ${scoreLabel}</div>`;
      listEl.appendChild(row);
    });
  }

  let unwatch = null;
  function loadGame(gameId) {
    if (unwatch) unwatch();
    unwatch = AIGLeaderboard.watchGame(gameId, render);
  }

  // "This Week" and "Speed Round" are both one-time reads (see
  // getWeeklyLeaderboard/getSpeedRoundLeaderboard's own reasoning), not a
  // live subscription, so switching to either first tears down any live
  // watchGame() listener.
  async function loadWeekly() {
    if (unwatch) { unwatch(); unwatch = null; }
    document.getElementById("lb-podium").innerHTML = "";
    document.getElementById("lb-list").innerHTML = "";
    const { ranking } = await AIGLeaderboard.getWeeklyLeaderboard();
    const data = {};
    ranking.forEach(r => { data[r.id] = r; });
    render(data, "correct", "correct");
  }

  async function loadSpeedRound() {
    if (unwatch) { unwatch(); unwatch = null; }
    document.getElementById("lb-podium").innerHTML = "";
    document.getElementById("lb-list").innerHTML = "";
    const ranking = await AIGLeaderboard.getSpeedRoundLeaderboard();
    const data = {};
    ranking.forEach(r => { data[r.id] = r; });
    render(data, "best", "best score");
  }

  const SCOPES = {
    alltime: { label: "Ranked by <b>🎮 times played</b>", showTabs: true, load: () => loadGame(activeGame) },
    weekly: { label: "Ranked by <b>🎯 correct answers this week</b>", showTabs: false, load: loadWeekly },
    speedround: { label: "Ranked by <b>⚡ Speed Round best score</b>", showTabs: false, load: loadSpeedRound }
  };
  function switchScope(scope) {
    Object.keys(SCOPES).forEach(s => document.getElementById(`lb-scope-${s}`).classList.toggle("active", s === scope));
    document.getElementById("lb-tabs").hidden = !SCOPES[scope].showTabs;
    document.getElementById("lb-metric-label").innerHTML = SCOPES[scope].label;
    // "This Week" doubles as a shareable Hall of Fame -- the podium above
    // already shows the top 3, this just frames it as something worth
    // screenshotting, same spirit as the hub's Weekly Recap card.
    document.getElementById("lb-hof-hint").classList.toggle("hidden", scope !== "weekly");
    SCOPES[scope].load();
  }
  document.getElementById("lb-scope-alltime").addEventListener("click", () => switchScope("alltime"));
  document.getElementById("lb-scope-weekly").addEventListener("click", () => switchScope("weekly"));
  document.getElementById("lb-scope-speedround").addEventListener("click", () => switchScope("speedround"));

  renderTabs();
  loadGame(activeGame);
</script>

</body>
</html>
